# ……。
 …………。
 ………………。
>
#【少女】
「客人您，
 是叫做筑宫先生对吧？」
>
# ———坐在筑宫正对面的少女，翻阅住宿登记簿的动作娴熟老练，到了这一步，越发确信不会有错了。
 原本，被带到这间号称“女掌柜房间”的客室，就再无他人气息，也不见后来有人要来的迹象。
>
#【清修】
「是的——那个，你、不，您就是这家旅店的『女掌柜』吗？」
>
# 虽已确信，却仍忍不住要问出口的筑宫，毕竟对座的少女，与他所知旅店女掌柜的形象全然不符。
 浮现在他脑海的女掌柜模样，要么是体态丰腴的女中豪杰，要么是身着和服的半老徐娘，无论如何都与少女沾不上边，年纪也远远不够。
>
#【少女】
「算是吧。
 我确实掌管着这里的里里外外，女佣们也都叫我『女掌柜』……什么的。」
>
#【少女】
「不过——怎么想，
 都不太相称吧？」
>
# 即便内心深以为然，被本人当面这样问起，筑宫也没有粗神经到能直说“是，我也这么觉得”。况且，少女那如打磨过的彩色玻璃般剔透的眸子，仿佛镜子般映照出青年的探究之心，令他坐立难安。
>
#【清修】
「这个嘛，不过，您这边自有您的情况吧……我，倒不觉得奇怪……」
>
#【少女】
「多谢您的体恤。」
>
# 或许是体恤筑宫的狼狈，少女莞尔一笑。那如同细笔蘸胭脂轻轻点就的唇瓣微微弯起，可谓是与年龄不符的成熟笑靥，却也是人造花般的、“面向客人的微笑”。
 即便如此，也比被她用素颜静静凝视要轻松些许。
>
#【少女】
「还有，腿可以放松些没关系的。
 请您随意就好。」
>
#【清修】
「啊……呃……」
>
# 再次低头看向膝下，才发觉自己正襟危坐，双膝并拢。
 少女自然也是端坐着，但他并非刻意模仿。只是无意识间便这么坐了，并未感到特别拘束，背脊也自然地挺直。这大概是失忆后也未曾磨灭、深植于身的第二本能吧。
>
# 如此看来，自己莫非是习惯了这种在榻榻米房间端坐的生活？为求稳妥，他试着探寻记忆，果然依旧空无一物。本就不抱期待，也并未多么失望，便如此答道。
>
#【清修】
「不，没关系的。
 看来我似乎很习惯正坐。」
>
#【少女】
「确实如此呢。
 姿势也非常优美。」
>
#【清修】
「是么……」
>
# “优美这个词是为您而存在的”之类肉麻的台词，纵使嘴唇裂开也说不出口，筑宫轻咳一声，环顾客房。
 他想，即便不是自己，任何被迎入这间客房的人，恐怕连坐姿也会不自觉地端正起来吧。
>
# 这里感觉不到丝毫少女闺房中常有的、糖蜜般的甜腻。本应是妙龄少女天性使然，会尽心用喜好填满、装饰自己的领地，那份因年轻而生的过度自我意识，要获得沉静尚需时日。
 然而这间客房，却简素至极，甚至令人感到一种清爽，超越了成熟，直抵侘寂之境。
 榻榻米是坚硬的上等席面，仿佛连指甲都难以留下痕迹，打扫得一尘不染；坚固的柱子笔直无曲，打磨得光可鉴人；总之，充盈客室的是清冽、清净，仿佛在诉说多余器具徒增杂乱般，只放置了最低限度的物品。
>
# 唯有角落一座镜台诉说着女性的修养，却也罩着真丝罩布，显得含蓄矜持。
 这房间虽略显缺乏风情与温润，筑宫却觉得合意。比起被少女趣味的人偶、带顶罩的睡床、刺绣装饰布等塞得满满当当的房间，这种简素的清朗反而更养眼，心也随之沉静。
>
# 简直像隐士清修的枯淡尼庵，但若说少女与此格格不入，则又不然。她的身姿如同不可或缺的最重要部件，与室内景致浑然一体，这里果然仍是属于她的私人领域。
>
#【少女】
「不好，忘了正事。
 得决定您的房间才行呢。」
>
#【少女】
「……关于房间，您有什么要求吗？」
>
# 虽不至于夸张到如同从北极出发经南极再回北极，但从账房被问及开始，对筑宫而言，仿佛经历了朝圣般漫长的路程，又回到了相同的问题。他不禁苦笑，
>
#【清修】
「不，没什么特别要求。
 只是……」
>
# 若全交由对方安排未免太无趣，也怕被误认为是连意愿都无法表达的懦夫，被塞进潮湿的被褥房，与腐坏枕头上自生的菌菇同寝。筑宫在内心搜寻着自己的房间偏好。他漫无目的地看着榻榻米的纹路，补充道。
>
#【清修】
「太大的房间，会让人静不下心。
 还有就是，如果可以的话，那个，对，请给我一间洁净的房间。」
>
# 他是被少女客房的清净所吸引，朦胧期盼着起居若能也在这样的房间便好，但说完便后悔失言。既号称旅店，为客人预备洁净房间岂非理所当然，何需他多言。
 ……如此这般，事事挂怀，这青年也想得太多了。
 少女也并未显得曲解筑宫的话，她目光在空中游移片刻，仿佛在勾勒脑海中的地图，随即点头，
>
#【少女】
「明白了。
 正好有间合适的空着……但愿您能满意。」
>
#【少女】
「稍后让女佣为您带路。
 请放心。
 离这里并不远。」
>
# 一瞬间掠过的、莫非又要长途跋涉的担忧，因少女的话而消散，但筑宫还有必须告知之事。
 虽不愿屡次提及，
>
#【清修】
「另外，虽不是什么体面事——」
>
# 以此开场，筑宫告知了自己失忆之事。并非要刻意宣扬，只是考虑到若少女不知情，或许会引起不必要的误会，乃是出于这份谨慎。
>
#【少女】
「那是……嗯。
 这方面我们也谅解了。」
>
#【少女】
「我们这边，会尽力让您感到方便。」
>
#【少女】
「若有任何不周之处，请不必客气，随时吩咐。」
>
# 若被报以痛惜怜悯的神情，或被如避蛇蝎般对待，反而会更觉压抑吧。幸好没有那般湿漉漉的反应，只是确认了他的状况，并承诺会给予相称的对待，这令他感激。
>
#【清修】
「我这边才要请您多关照……毕竟不单是想不起以前的事，好像连随身物品也全都遗失了，正有些不知所措——啊。」
>
# 一时松懈，正诉说着困境，筑宫的舌头却猛地打住。为何直到被引至旅店女掌柜的房间，定下自己房间的此刻，才想起来呢。早知如此，不如一直忘记才好，不，那也只是时间问题罢了。正当他惊慌失措时，少女疑惑地歪了歪头。
>
# 他心一横，坦白道。他还没那么胆大，能察觉不妙之事却保持沉默。
>
#【清修】
「那个……说随身物品全没了，意思就是……我连钱包和钱都没带。」
>
#【清修】
「住宿费该怎么办……」
>
# 该怎么办，说到底“旅店”终究只是旅店，并非为那无家无财、无所依傍的浮萍之人提供一夜住宿以积功德的慈善教团。虽说也存在所谓善根宿，免费接纳朝圣者，但一开始就期待这个也未免太厚脸皮。
 然而少女不知为何面不改色，这在他看来反倒像是责难，实则是他自己的焦躁使然。正当他进退维谷，明知无钱却无法泰然处之——他拍打起衣服各处，在旁人看来仿佛一场新式哑剧，不，不，本人可绝非在演戏——这时，从口袋里传来了确实的重量。
>
# 自认比谁都清楚自己一无所有的筑宫，只觉得这东西是何时悄然涌现于口袋中的。指尖探入，触到一条细链窸窣缠绕。
 是银链。拉出一看，链子那头连着一个银圆盘——为何直到现在才忘记？想到自己脑中塞满了木屑，筑宫不禁自惭。这不正是从摆渡人那里得到的怀表吗？
 不是还被告诫过，见到旅店的人，首先要出示此物吗？
>
#【清修】
「对，对了，是这个。
 从那位摆渡人那里得到的。
 说是要给旅店的人看。」
>
# 不知这被自己体温焐热的银器究竟有何意义，递过去后，少女了然般点了点头。
 或者说，仿佛早已预料到。
>
#【少女】
「是，已确认过了。
 这样您就不必担心住宿费等事宜了。」
>
#【少女】
「而且，关于费用，您原本也不必太过在意。
 这里，就是这样的地方。」
>
# 听她说，对于那位摆渡人引荐而来的人，这家“旅店”历来惯例几乎是无条件敞开大门。
 即便如此——少女将银怀表左右细看后，递还给筑宫，
>
#【少女】
「即便如此，那个人会将此物托付给谁，可是从未有过的事呢。」
>
#【少女】
「这只怀表，在这里就如同随处可通的通行证一般。」
>
#【少女】
「筑宫先生，您真是深受那位青睐啊。」
>
# 这银怀表功效卓著，远超筑宫预料，似乎是摆渡人与旅店世代契约的凭证。据说在旅店内，它几乎被视为全能的通行证。为何摆渡人会如此随意地将这看似贵重的银器交给自己？虽被少女如此说，自己是否真被那位面容冷峻的女子如此看重……实在缺乏实感。
 虽缺乏实感，但怀表确确实实就在他手中。
>
# 莫非其中还蕴含着他尚未知晓的意念？刹那间，仿佛产生了千钧重负，他慌忙握紧以免掉落，但怀表终究只是怀表的分量。只是从指缝间垂落的表链光泽，似乎变得强烈浓郁起来……那是因为客房的阴影渐深。午后已悄然流逝，暮色渐浓。
>
#【少女】
「您辛苦了。
 这下麻烦事都结束了。
 之后请在房间好好休息吧。」
>
# 依少女之言从怀表上抬起脸，不知何时已被唤来，客房门口，负责引领筑宫的女佣早已等候在那里。
>
