# 如侦探小说关键页全然缺失，筑宫愤然无处宣泄，忽闻宴乐——
>
# ……自隔壁座席传来。中隔拉门紧闭，唯音漏出。此乃人之性也：落语之『落』、侦探之揭凶，岂能不闻？筑宫疑为戏弄，鼻息粗重，闯入座席。
 既至此，必见宴真相。奔至门前，双手猛推——
>
# 啪——！声彻清冽，沁入胸臆，然座席依旧空无一人，宴踪全无。杉酒香、三味线韵犹存，唯宴席杳然。空空如也，空空如也。
>
# 筑宫蹙眉，忽觉鼻端湿热氤氲。此异状初未觉，细思则愈觉诡异。
>
# 推门所见，竟为——
>
# 一巨大汤殿。规模契合『旅笼』之广，汤气濛濛芬芳，浴槽洗处皆槙木造，然无甚奇处。
 然细想：座席直通汤殿，无更衣处，已属无理；且洗场浴槽皆空无一人，唯新汤满溢，暖雾轻摇，无客之鼻歌、桶声——岂非怪哉？
>
# 唯有遥远处，宴乐依稀，却似随汤雾飘入汤殿深处，渐行渐远。此般撩拨，更令筑宫心痒难搔！
>
# 似武藏野之逃水，愈追愈遁。若筑宫此刻尚存一分清明，或可止步；然此亦妄言。
>
# 筑宫已决意追至，忘却侍女，誓见宴影。挽袖、拍颊、振作精神，直入汤殿深处——
