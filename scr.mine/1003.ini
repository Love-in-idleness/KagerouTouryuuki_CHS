# 天花板下，骤雨突至。肩发湿透，水沿颊滴落。若为冷雨，或如雪水洗芥末，令人心清神醒。然此雨竟温——恐因方才裂帛一击，汤气凝饱和而化雨，却似巨魔潜伏顶上，垂涎欲食，此乃其涎。
>
# 筑宫僵立，恐头顶雾中现魔首噬咬，忽闻耳畔——
