# 木地板铺就的走廊，带着独特而微弱的弹性反拨感，脚踏其上，吱呀作响。侍女的脚步与筑宫的脚步此起彼伏，如轮唱般交叠。廊道时而右折，时而左弯，偶有台阶制造坡度，又分岔，复交汇。回廊若至此般绵长广袤，连地板的呻吟亦旋即被空间吞没，唯余寂静愈显深邃。虽偶有声响自各处传来，却如隔轻纱，遥远得恍若梦呓。
>
#【侍女】
「脚下留神些。
 偶有台阶，常有人绊倒。」
>
#【清修】
「啊，好的……」
>
# 侍女自是熟稔无比，两三级台阶一迈而过；筑宫却俯身一一细察。细看之下，台阶竟藏抽屉，如阶梯式箱柜，内中所藏何物，引得青年遐思。廊道两侧的拉门与纸门皆为通风而敞开，不经意窥视，视线竟能穿透连绵座席，直抵尽头的棂子窗。那窗似自发光晕，轮廓朦胧洇染，柔和地为隔间的拉门转角与壁龛幽隅，投下温软阴影。正因如此幽暗，方有掌管家宅富贵的童子精魂，或令梁柱吱呀作响的小鬼潜藏其间。近代建筑只知追逐便利之明，早已遗忘此等阴翳；而此『旅笼』之中，阴翳却无处不在。
>
# 世间所谓『道乐』，种类繁多，一旦为其魔性所惑，沉溺其中，终致倾家荡产者比比皆是。近如食道乐、衣装道乐，尚且足以令人倾覆；其中尤以『普请道乐』为最——论其体量之巨、耗费之奢、金钱之靡，几无出其右。
>
# 其本质，不过是在屋舍之上不断增建扩建，徒然扩大、错综其结构以为乐事。语之文字，不过如此；然此『普请道乐』，却最能赤裸裸地映照出人心之妄执与偏执。
>
# 且此道乐愈陷愈深，则愈堆砌奢华、愈雕琢意匠。然而，无人居之室空置成群，无人行之廊延绵无尽，窗列紧闭，徒令玻璃黯淡蒙尘。至此，已非徒然无意义，而竟孕出一种空寂之怖。
>
# 本国有所谓『黑死馆』之不祥诨名者，即旧降矢木邸；另有传闻藏于四国山中、人称『珍珠邸』之那越邸；若论东西无别，则美国之温彻斯特馆尤为骇人。此乃温彻斯特枪械家族遗孀所建巨厦，其内竟遍布：
『窄至无法通行之人径』
『通向虚空之门扉』
『登至尽头却无去路之阶梯』
 种种无理构造星罗棋布，自落成之初，便已恣肆享有『鬼屋』之名。
>
# 然而，筑宫青年却莫名不觉此『旅笼』乃以狂气为梁、妄念为柱所筑。诚然，初见时，其外貌确曾以其异样混沌之重，令筑宫心眩目迷；此刻身陷这多重层叠之屋宇，视觉与方位感轻度失调，如醉如醺，亦是事实——然此酩酊之感，却伴有一种隐秘的欢愉。
>
# 筑宫虽甫至不久，且一路为所震慑，却似已对此奇诡『旅笼』生出依恋。
>
# 若谓之『被摄取』，亦无不可。盖依恋近于执著，执著障蔽觉悟，释迦牟尼佛尝谆谆教诲：弃之，远之。
>
# 然若无依恋、无执著，又何来俗世？何来人间？藏书家轻抚书架藏品之脊背，必感无疑之满足与幸福。
 少女频频造访心仪之杂货铺，品评精致香水瓶，试戴耳饰对镜端详，无论购或不购，此一刻皆为喜悦；若为猫，定已呼噜作响。非因器物本身，实因这细碎琳琅所织就之小世界，令人爱怜。
 无可爱之物、无可爱之世界者，或谓身轻；然此轻，岂非与寂寥相依？
>
# 筑宫虽失却大半记忆，却仍存有足以爱一世界之人情。然彼亦不解，何以对此初临之『旅笼』，竟生出类乎乡愁之念——此刻尚不得其解。
>
# 或正因失忆，方易为这满是旧日气息之空间所倾——岁月浸润之木肌，皆被手泽磨出温润轮廓。
>
# 因此怀古好古之眼四处流连，筑宫又落后于侍女。面对彼等容貌无异之人，脑中唯余『何以皆同貌』之俗问，别无话题，言语遂如梅雨断续，终致目光尽落周遭物事。
>
