# 声自全然未料之向，筑宫惊得肩头一颤。袖口被人轻扯，回首见侍女面露疑色。
>
#【清修】
「啊，呃……？怎、怎会在后面？」
>
# 此即所谓『清醒』——再看时，廊道分明未分岔，前方数步竟已尽头。
>
#【清修】
「咦！？方才那分左右之廊……？」
>
# 筑宫满脸困惑，侍女似已会意，颔首道：
>
#【侍女】
「客人，您差点掉进『伪廊下』了呢。」
>
#【清修】
「……那是什么？」
>
#【侍女】
「就是看到本不存在的廊道罢了？时常有这事。」
>
#【侍女】
「尤其初来乍到、不熟此地的客人，常被捉弄。」
>
#【侍女】
「若信以为真往前走，定撞墙头破血流。」
>
# 果如其言，筑宫无论择左择右，若急奔而去，必撞壁鼻青脸肿。旁观者或觉滑稽如漫画，当事人却陷混乱之极。
>
#【清修】
「为何会有此等事……究竟……」
>
#【侍女】
「老宅嘛，总有些怪事。
 我们这儿也差不多。」
>
#【清修】
「虽闻有此说……」
>
# 器物百年成精，化为『付丧神』；屋宅经年，亦可积聚人事记忆，生出异象，此说不无道理。
>
# 然亲历怪事，终究突兀。常人遇之，多归咎于幻觉，以求心安。筑宫亦然，然侍女竟坦然承认。
 本盼其笑言『白日梦矣』以解尴尬，反被轻描淡写道破，筑宫顿感泄气。侍女虽神秘莫测，性情却温顺，此际筑宫心乱如麻，正需此等安稳。
>
#【侍女】
「无妨。心志坚定者，通常不会中招。
 ……走吧。」
>
# 她转身往正途疾行，筑宫不敢再分神，只紧盯其背影随行。
>
#【清修】
「常有此类事吗……」
>
#【侍女】
「嘛，偶尔吧。」
>
# 本欲专心跟随，不料周遭杂音忽显清晰。足音、头顶楼板吱呀（必是上层有人行走）、身后『砰』一声（似拉门开启）、远处模糊人语……筑宫耳中纷至沓来。
>
# 于是方知，『旅笼』之静，并非死寂，而是藏万籁于无声，乃活之静也。如人静坐，虽不动不言，近之可闻息，按之可觉脉。
>
# 诸音之中，尤引筑宫注意者，乃侧室传出之喧闹欢腾。似有宴席，热闹轻快却不刺耳。常人闻他人宴乐，多觉被嘲而心不安；此断续喧声，却掺有清冽之感，引人向往。筑宫几被吸引，勉强自持，匆匆走过。
>
# 然宴乐如影随形，竟似修学旅行巴士将发未发，令人焦灼难耐。筑宫咬唇强忍，唯盼速离此声。
>
# 奈何——宴乐未消，前方座席又起欢宴。
 声响较前更盛，似以音邀人……不，不，岂有此理！筑宫自诫勿听，恨不能速速远离。侍女步履却悠然不迫，全然不察其焦。
>
#【侍女】
「快到了，老板娘的座席就在前面。」
>
#【清修】
「啊啊，拜托快些……」
>
# 此乃肺腑之言。筑宫边走边惑：区区宴乐，何以撼动心神？忽而喉间一紧，吞咽空唾。
>
# 宴乐非但未远，竟似贴身随行……？
>
# 荒谬！定是心有未甘，耳生幻听。然此念一起，反凝神细听——一旦听入，此音便再难摆脱，如飞蛾扑火，筑宫轻易为其所俘。诱蛾灯下，飞蛾明知焚身亦难自抑；此宴乐无险无危，筑宫更无抵抗之力，竟被牵引，步向座席。
>
# 仅窥一眼，仅看一眼——察其宾客何人、行何游兴，绝无奢望入席。幸侍女未回首，廊道笔直漫长，稍停无妨。筑宫手触拉门把手，缓缓施力——门缝渐开，如揭薄册，青年心跳之烈，堪比童子初窥舶来望远镜，纯然无垢之憧憬。
>
# 然憧憬之尾，常系幻灭之穗。嫦娥之月貌，望远镜下不过荒凉陨坑；未明之境，有时更善护人心。
 筑宫从窄缝窥见之景，若见白粉覆斑老妪裸身扭脐，脂脸翁围拍手助兴——尚可接受。若非此。
>
# 若见千岁老猿自群山聚，共谋讨伐岩见重太郎，预庆举樽——亦可释然。
>
# 然满怀期待所见，竟是——
>
# 蝉蜕之壳，空壳之空。只得见格天井下悬一乳白玻璃罩，罩内球灯约四十烛光，一丝不苟地映照着空寂的榻榻米。因无人此景更显寒凉，筑宫对此失望至极。
>
#【清修】
「这、这算什么……」
