>
#【声】
「让您久等啦——」
>
# 近处纸门内，人影一闪，滑开，另一侍女双手抱满木板，竟以足趾灵巧开门。
 陆续涌出两三人，皆同貌侍女。少女一指廊上巨洞，众侍女即会意，齐声应『是』，挽袖修缮。筑宫悟：叩柱乃符信。
>
# 侍女虽同貌，引路者似不在其中。众人瞥筑宫一眼，即专注作业。
 少女旁观片刻，道：
>
#【少女】
「久等了。
 走吧。」
>
# 少女先行，背脊笔直，中正不偏。筑宫自觉若不正姿，便显无礼。其言行动止，端庄至令人窒息。筑宫暗忖：此女必为主事者，或为老板娘之女，或亲眷。
>
# 所幸未行多远，筑宫已觉腿乏。
>
# 不知身处『旅笼』何方，唯盼速歇。与少女同行，沉默愈显沉重，不若与侍女同行自在。
>
#【少女】
「劳您久随，见谅。
 老板娘座席已近，请再忍耐片刻。」
>
#【清修】
「啊，无妨，不必介意。」
>
# 筑宫应声轻快，显见如释重负。
 终至廊道深处一室，少女驻足——
>
# 纸门敞开之座席前，一侍女正伫立，见筑宫，松一口气。
>
#【侍女】
「又失散了……！
 您若乱跑，我可头疼了。」
>
# 其手持宿簿，显为引路之人（筑宫仍难分辨）。
 虽被责，筑宫微愠，然下句令其愕然：
>
#【侍女】
「不过，途中见到老板娘了吧？那便无妨了。」
>
# 筑宫愕然回首，侍女却已将宿簿递予少女。
>
# ——于是，筑宫恍然。
 青年再三注视，忽入座席，深躬至地——
>
#【少女】
「那么——容我重新致意。
 欢迎光临寒舍。」
>
# 其礼，自正座起，流畅无隙。三指并拢，六指触席，一线齐整，三叩首。
 肩腰纤弱似筑宫双手可围，然此『旅笼』之主，竟以如此娇躯承此重担——
 ……恍若廊下拍子木一响，少女三叩之姿，竟将『旅笼』全副存在，凝缩、收束于一点。
>
