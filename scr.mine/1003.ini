（糟了，若在此与她失散，必陷此廊道迷宫，遭难无疑……）
>
# 急提脚步，前方廊道分作两岔，侍女回头唤道：
>
#【侍女】
「这边请——」
>
# 言罢右转而去。筑宫定神欲追，忽闻另一侧廊道传来微响——似裙摆窸窣。
