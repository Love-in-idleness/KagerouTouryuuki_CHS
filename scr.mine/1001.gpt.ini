# ………………
…………
……
>
#【渡し守】
「……你啊，是时候醒一醒了，嗯」
>
# ……在她开口之前，落在眼睫上的光已经先一步把身体从睡眠的深处推了上来。半睡半醒之间，青年最先尝到的，是某种近乎荒漠般的无依感。
>
# 被困在被褥里的，那股陌生女子的气息，大概是名为“渡守”的她留下的余香。外貌古怪得让人退避三舍，却又心思细密、热心操持，这女子是个奇异的存在。还是自己的救命之人。
>
# 至于这张让他贪睡的被褥此刻仿佛放在巨人的手掌里，轻轻地向右摇，再向左摇，那是因为这一间小屋本就安置在小舟的船腹之中——一艘顺河而行的渡船。
>
# 这些经历究竟是“异境之旅”还是“人皆可能遇见之事”，青年无从判断。因为本该作为准绳的过去记忆，已从他的脑髓中整个剥落。
>
#【青年】
（不……但就算这样，这也不是常人能想象的状况吧……？）
>
# 青年怔然地想。
>
# 失忆的自己，被一位奇妙女子驾着仿佛遗世的旧船运送着……这一切缺乏现实的重量，像梦境还在延续。
>
# 就连自己曾坠河濒死之事，此刻抱着暖融融的被褥时，也竟开始像是梦里的片段，轻得不像真实。
>
# 他正想再享受片刻的惰眠，把被褥拉到鼻梁处时，鼻尖忽地一凉。
>
#【渡し守】
「都说叫你起来了……再过一会儿就到了哦」
>
# 也许是对这只在被窝里缩成个蓑虫、半点不打算“站起来”的青年感到无可奈何，渡守将一块吸满清水的手巾轻轻按到他的鼻尖，随之，“滴答”一滴凉意坠下。
>
# 那滴冷意瞬间收紧了他散漫的意识，让身体重新找回自己的边界。随之复活的，是青年那种第二天性般的谨慎与拘束。他突然清楚地意识到：身上穿的不是自己的衣服，身下睡的不是属于自己的床，被褥里也不是熟悉的体味，而是女子的香息。意识到这一点后，他已无暇再沉溺于困倦。真正将他从睡眠中推起的不是清水，而是骤升到几乎像威胁般的歉疚、罪感与羞惶。
>
# ——穿着女子的衣服，睡在女子的床铺上——
光是这个事实，对青年而言就沉重得近乎骇人。
>
# 他掀开被褥，半身弹起，那姿态几乎像一只被弹簧顶起的木偶。渡守隔着单袖的袂掩着嘴，不知是否在笑，但眼角里分明挂着看他好戏的光。
>
#【渡し守】
「怎么啦，像只米搗跳虫似的，一下子就蹦起来」
>
#【渡し守】
「看来睡得挺熟啊。其实再让你多睡一会儿也成的——」
>
#【渡し守】
「不过马上就要到了，你还是得醒一醒才好」
>
# 障子筛过光，使船腹的空间里氤氲着慵懒的气息。
但渡守依旧戴着那张可怖的破裂般若面。青年虽不至于像昨夜初见那般失措，却仍压不住心下的震动。那副异相并非能凭“习惯”来吞下的平常之物。因此，他花了一点时间，才把她的话咀嚼明白。
>
#【青年】
（“到了”……要到哪里……？）
>
# 他困惑地侧头，渡守耐性十足地解释。
>
#【渡し守】
「……昨晚上，不是说好了嘛」
>
#【渡し守】
「我答应了，要带你去‘旅店’。
——答应了的事，我可不食言」
>
# 青年想起昨夜的对话，便伸手推向右边的障子。想先看看这条河究竟是什么模样，岸上是什么景色，又或者能否望见那“马上就到”的旅店的影子。
>
# 障子被推开时轻得像风拂旧纸。青年探身望向外面。
>
#【青年】
「——呃、哈？」
>
# 那声又轻又傻的鼻息，连他自己听起来都像隔着远方飘来的。不管是不是傻，他都顾不上了：他完完整整被面前的景象吞没。
>
# 仿佛推开一间鄙陋小屋的门，却望见巨人国度；又仿佛迈过脚下的一条浅沟，才发现它其实是无底深渊。
这般猝然的冲击，让青年瞳孔一瞬大张。
>
# 障子外，小舟的舷边外本该是水。
有人若这时摇头说“既然是船，外面是水也是当然”，那人最好立刻用脑袋去冰冷河水里浸一浸。
>
# 水，确是水。但这水广阔到吞噬所有眼界，天地在此似只剩一个“天”与一片无尽的“水”。
在如此辽阔的水域面前，即便这艘小舟换成钢铁军舰，也和一片草叶折成的玩具无异，同样脆弱。
青年一瞬间以为自己是从河流入了海，可这片水域却无盐香，只有凉意如轻风般铺面。
>
#【青年】
「这……这里究竟是什么……」
>
#【渡し守】
「啥啊，不就是河么」
>
#【青年】
「就算你这么说……我从没见过这么宽的河」
>
#【渡し守】
「世上什么都有第一次。你没见过，它也依旧是河」
>
#【渡し守】
「在这儿渡人这么多年，我说的话，还能骗你不成」
>
# 她斩钉截铁，青年只能沉默着点头。他眯起眼，想看透这水域的尽头。若能看见分明的水平线，说不定还能坦然地接受这无边的水，但那远方只在雾霭里模糊，与天相溶，说不出的飘忽，使人心口空落。
>
# 天空无云却见不着日头，高处仿佛覆着一层薄纱。
这样的光，不明不暗，称作“高曇”。
也无风，水面平得像屏息。
与其说平静，不如说整个世界微微停滞。
水映着天，一片迟缓的青碧，流也似不流。
>
#【青年】
「可……宽得近乎荒唐了……」
>
# 他试图回忆自己坠落之处是否也如此广阔，却一无所获。看向外的那一刻，他本以为能见到岸，甚至旅店的影子——但眼前尽是无际的水。他向渡守表达了这份困惑。
>
#【渡し守】
「哎呀，是反了反了。不是那边啦」
>
# 她在船腹里轻扬袖口，走去另一侧，推开左边的障子。那声脆亮的“噹”仿佛敲在空气里。
也就在那一瞬间，青年的心神再次被巨浪般的震撼淹没——甚至比之前更为彻底。
>
#【青年】
「诶……？　呃……啊!?」
>
# 他跟着渡守的动作转身，望去的刹那，整个人像被抽空似的瘫坐在磨得发亮的畳上。
>
# ……后来青年会无数次经历“被景象压倒”的瞬间，但从未有任何一次能超越这一刻。
>
# ——那“它”，已不能被称作建筑的集合。
更像是，一种被显现出的混沌本身。
>
# 桀骜的鹰眼，或是流动的群影……
